<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japan 14 Day Trip</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

html,body{
margin:0;
padding:0;
font-family:Roboto,Arial;
background:#f0f2f5;
color:#333;
}

header{
background:#34495e;
color:white;
text-align:center;
padding:20px;
font-size:1.5rem;
}

#map{
height:75vh;
max-width:1000px;
margin:20px auto;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

#controls{
max-width:1000px;
margin:20px auto;
background:#2c3e50;
padding:15px;
border-radius:8px;
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
color:white;
}

.cityTitle{
flex-basis:100%;
font-weight:bold;
margin-top:10px;
letter-spacing:1px;
}

button{
border:none;
padding:8px 14px;
border-radius:4px;
background:#e67e22;
color:white;
cursor:pointer;
}

button:hover{
background:#d35400;
}

button.active{
background:#c0392b;
}

#infoBox{
max-width:1000px;
margin:20px auto 40px;
background:white;
padding:25px;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
line-height:1.7;
}

#infoBox b{
display:block;
text-align:center;
font-size:1.3em;
margin-bottom:15px;
}

#infoBox pre{
white-space:pre-wrap;
font-family:Roboto;
}

</style>
</head>

<body>

<header>
Japan Trip Planner
<button onclick="downloadItinerary()" style="margin-left:15px;font-size:0.8em;padding:4px 8px;">Download</button>
</header>


<div id="controls">

<div class="cityTitle">Tokyo (Arrival)</div>
<button onclick="showDay(1)">Jun 24</button>
<button onclick="showDay(2)">Jun 25</button>
<button onclick="showDay(3)">Jun 26</button>
<button onclick="showDay(4)">Jun 27</button>

<div class="cityTitle">Fuji / Hakone</div>
<button onclick="showDay(5)">Jun 28</button>
<button onclick="showDay(6)">Jun 29</button>

<div class="cityTitle">Kyoto</div>
<button onclick="showDay(7)">Jun 30</button>
<button onclick="showDay(8)">Jul 1</button>

<div class="cityTitle">Osaka</div>
<button onclick="showDay(9)">Jul 2</button>
<button onclick="showDay(10)">Jul 3</button>

<div class="cityTitle">Tokyo (Return)</div>
<button onclick="showDay(11)">Jul 4</button>
<button onclick="showDay(12)">Jul 5</button>
<button onclick="showDay(13)">Jul 6</button>
<button onclick="showDay(14)">Jul 7</button>

</div>


<div id="map"></div>

<div id="infoBox">
<b>Select a date</b>
</div>


<script>

var map = L.map('map').setView([35.5,137],6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

var currentLayer=null;


const trip={

1:{
date:"Jun 24",
city:"Tokyo",
coords:[[35.6762,139.6503],[35.6595,139.7005]],
text:`
Arrival day

• Airport → hotel
• Light rest

Evening:
– Shibuya crossing
– Shibuya Sky sunset
– Explore Center-gai

Food:
ramen or sushi
`
},

2:{
date:"Jun 25",
city:"Tokyo",
coords:[[35.6984,139.7730],[35.7138,139.7774]],
text:`
Akihabara + Ueno

Morning:
– Anime shops
– Arcades
– Gachapon machines

Afternoon:
– Ueno Park
– Shinobazu pond
`
},

3:{
date:"Jun 26",
city:"Tokyo",
coords:[[35.7148,139.7967],[35.7100,139.8107]],
text:`
Asakusa + Skytree

Morning:
– Senso-ji temple
– Nakamise street

Afternoon:
– Tokyo Skytree
– Solamachi mall
`
},

4:{
date:"Jun 27",
city:"Tokyo",
coords:[[35.6329,139.8804]],
text:`
DisneySea / Disneyland

Arrive before opening

Top rides:
– Beauty and the Beast
– Pooh ride
`
},

5:{
date:"Jun 28",
city:"Fuji / Hakone",
coords:[[35.2323,139.1069]],
text:`
Travel to Hakone

Hakone loop:
– Ropeway
– Pirate ship
– Owakudani black eggs

Evening:
– Ryokan
– Onsen
`
},

6:{
date:"Jun 29",
city:"Fuji",
coords:[[35.3606,138.7274]],
text:`
Lake Kawaguchi

Best Fuji views

Ideas:
– cable car
– lakeside walk
`
},

7:{
date:"Jun 30",
city:"Kyoto",
coords:[[35.0116,135.7681]],
text:`
Shinkansen to Kyoto

Afternoon:
Fushimi Inari shrine hike
`
},

8:{
date:"Jul 1",
city:"Kyoto",
coords:[[35.0094,135.6668]],
text:`
Arashiyama

– Bamboo forest
– Tenryu-ji
– monkey park
`
},

9:{
date:"Jul 2",
city:"Osaka",
coords:[[34.6654,135.4323]],
text:`
Universal Studios Japan

Must areas:
– Nintendo World
– Harry Potter
`
},

10:{
date:"Jul 3",
city:"Osaka",
coords:[[34.6937,135.5023]],
text:`
Osaka city

– Kuromon market
– Dotonbori night food
`
},

11:{
date:"Jul 4",
city:"Tokyo",
coords:[[35.6702,139.7026]],
text:`
Harajuku

– Meiji Shrine
– Takeshita street
`
},

12:{
date:"Jul 5",
city:"Tokyo",
coords:[[35.6272,139.7768]],
text:`
Odaiba

– TeamLab
– DiverCity
`
},

13:{
date:"Jul 6",
city:"Tokyo",
coords:[[35.6895,139.6917]],
text:`
Free exploration

Ideas:
– Ginza
– Shimokitazawa
– shopping
`
},

14:{
date:"Jul 7",
city:"Tokyo",
coords:[[35.5494,139.7798]],
text:`
Departure day

Go to airport 3h before flight
`
}

};


function showDay(day){

if(currentLayer){
map.removeLayer(currentLayer);
}

const data=trip[day];

currentLayer=L.layerGroup();

const poly=L.polyline(data.coords,{weight:4}).addTo(currentLayer);

data.coords.forEach(c=>{
L.marker(c).addTo(currentLayer);
});

currentLayer.addTo(map);

map.fitBounds(poly.getBounds());

document.getElementById("infoBox").innerHTML=
"<b>"+data.date+" — "+data.city+"</b><pre>"+data.text+"</pre>";

document.querySelectorAll('#controls button').forEach(b=>b.classList.remove('active'));

const btn=document.querySelector('#controls button[onclick="showDay('+day+')"]');

if(btn)btn.classList.add('active');

localStorage.setItem('lastDay',day);
}


function downloadItinerary(){

let csv='Date,City,Details\n';

Object.values(trip).forEach(d=>{
csv+=d.date+','+d.city+','+d.text.replace(/,/g,'')+'\n';
});

const blob=new Blob([csv],{type:'text/csv'});
const a=document.createElement('a');

a.href=URL.createObjectURL(blob);
a.download='japan_itinerary.csv';

a.click();
}


window.addEventListener('load',()=>{
const last=localStorage.getItem('lastDay');
if(last)showDay(last);
});

</script>

</body>
</html>
