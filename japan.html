<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japan 14 Day Trip</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

html,body{
margin:0;
padding:0;
font-family:Roboto,Arial;
background:#f0f2f5;
color:#333;
}

header{
background:#34495e;
color:white;
text-align:center;
padding:20px;
font-size:1.5rem;
}

#returnToHotelBtn{
background:#e67e22;
color:white;
border:none;
padding:4px 8px;
margin-left:10px;
cursor:pointer;
border-radius:4px;
}

#map{
height:75vh;
max-width:1000px;
margin:20px auto;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

#controls{
max-width:1000px;
margin:20px auto;
background:#2c3e50;
padding:15px;
border-radius:8px;
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
color:white;
}

.cityTitle{
flex-basis:100%;
font-weight:bold;
margin-top:10px;
letter-spacing:1px;
}

button{
border:none;
padding:8px 14px;
border-radius:4px;
background:#e67e22;
color:white;
cursor:pointer;
}

button:hover{
background:#d35400;
}

button.active{
background:#c0392b;
}

#infoBox{
max-width:1000px;
margin:20px auto 40px;
background:white;
padding:25px;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
line-height:1.7;
}

#infoBox b{
display:block;
text-align:center;
font-size:1.3em;
margin-bottom:15px;
}

#infoBox pre{
white-space:pre-wrap;
font-family:Roboto;
}

</style>
</head>

<body>

<header>
Japan Trip Planner
<button onclick="returnToHotel()" style="margin-left:10px;font-size:0.8em;padding:4px 8px;">Return to Hotel</button>
</header>


<div id="controls">

<div class="cityTitle">Tokyo (Arrival)</div>
<button onclick="showDay(1)" data-day="1">Jun 24</button>
<button onclick="showDay(2)" data-day="2">Jun 25</button>
<button onclick="showDay(3)" data-day="3">Jun 26</button>
<button onclick="showDay(4)" data-day="4">Jun 27</button>

<div class="cityTitle">Fuji / Hakone</div>
<button onclick="showDay(5)" data-day="5">Jun 28</button>
<button onclick="showDay(6)" data-day="6">Jun 29</button>

<div class="cityTitle">Kyoto</div>
<button onclick="showDay(7)" data-day="7">Jun 30</button>
<button onclick="showDay(8)" data-day="8">Jul 1</button>

<div class="cityTitle">Osaka</div>
<button onclick="showDay(9)" data-day="9">Jul 2</button>
<button onclick="showDay(10)" data-day="10">Jul 3</button>

<div class="cityTitle">Tokyo (Return)</div>
<button onclick="showDay(11)" data-day="11">Jul 4</button>
<button onclick="showDay(12)" data-day="12">Jul 5</button>
<button onclick="showDay(13)" data-day="13">Jul 6</button>
<button onclick="showDay(14)" data-day="14">Jul 7</button>

</div>


<div id="map"></div>

<div id="infoBox">
<b>Select a date</b>
</div>


<script>

var map = L.map('map', {scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false}).setView([35.5,137],6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

var currentLayer=null;
var currentHotel=null;

const hotels = {
  tokyo1: [35.6895, 139.6917], // Tokyo Station
  hakone: [35.2323, 139.1069], // Hakone
  kyoto: [34.9854, 135.7587], // Kyoto Station
  osaka: [34.7024, 135.4959], // Osaka Station
  tokyo2: [35.6895, 139.6917] // Tokyo Station
};


const trip={

1:{
date:"Jun 24",
city:"Tokyo",
coords:[[35.6762,139.6503],[35.6595,139.7005]],
activities:["Shibuya Crossing", "Shibuya Sky"],
text:`
Arrival day

• Airport → hotel
• Get Suica / PASMO
• Light rest

Evening (easy first night):
– Shibuya Crossing
– Shibuya Sky sunset
– Walk Center-gai

Food idea:
Ramen or conveyor sushi
`
},

2:{
date:"Jun 25",
city:"Tokyo",
coords:[[35.6984,139.7730],[35.7289,139.7100]],
activities:["Akihabara", "Ikebukuro"],
text:`
Anime + Otaku day

Morning:
Akihabara
– Arcades
– Gachapon
– Mandarake
– Super Potato

Afternoon:
Ikebukuro
– Animate (largest anime store)
– Sunshine City

Tip:
Keep luggage light — lots of browsing
`
},

3:{
date:"Jun 26",
city:"Tokyo",
coords:[[35.7148,139.7967],[35.7100,139.8107]],
activities:["Asakusa (Senso-ji)", "Tokyo Skytree"],
text:`
Traditional Tokyo

Morning:
Asakusa
– Senso-ji temple
– Nakamise shopping street

Afternoon:
Tokyo Skytree
– observation deck
– Solamachi mall

Snack ideas:
melon pan / taiyaki
`
},

4:{
date:"Jun 27",
city:"Tokyo",
coords:[[35.6329,139.8804]],
activities:["DisneySea"],
text:`
DisneySea (recommended)

Arrive 30–45 min before opening.

Top rides:
– Journey to the Center of the Earth
– Soaring
– Tower of Terror

Tips:
Use Premier Access for big rides.
Bring portable charger.
`
},

5:{
date:"Jun 28",
city:"Fuji / Kawaguchiko",
coords:[[35.3606,138.7274],[35.5170,138.8064]],
activities:["Lake Kawaguchi", "Mt Fuji"],
text:`
Travel to Fuji area

Tokyo → Kawaguchiko (~2 hours)

Main ideas:
– Lake Kawaguchi walk
– Mt Fuji panorama ropeway
– Oishi Park views

Optional:
– Fuji scenic viewpoints
– Relaxing day

Evening:
Ryokan / hotel
Rest early for Fuji-Q tomorrow
`
},

6:{
date:"Jun 29",
city:"Fuji",
coords:[[35.4875,138.7800]],
activities:["Fuji-Q Highland"],
text:`
Fuji-Q Highland 🎢

One of the best theme parks in Japan.

Major rides:
– Eejanaika
– Takabisha
– Fujiyama
– Do-Dodonpa

Tips:
Arrive early.

Mount Fuji views from the park if weather is clear.

Spend most of the day here.
`
},

7:{
date:"Jun 30",
city:"Kyoto",
coords:[[35.0116,135.7681],[34.9671,135.7727]],
activities:["Kyoto Station", "Fushimi Inari"],
text:`
Travel to Kyoto

Morning:
Shinkansen (~2h)

Afternoon:
Fushimi Inari shrine

Walk through the famous torii gates.
Going halfway up the mountain is perfect.

Best time:
Late afternoon / sunset
`
},

8:{
date:"Jul 1",
city:"Kyoto",
coords:[[35.0094,135.6668]],
activities:["Arashiyama"],
text:`
Arashiyama

Morning (go early):
– Bamboo forest
– Tenryu-ji temple

Optional:
Monkey park hike

Afternoon:
River walk
`
},

9:{
date:"Jul 2",
city:"Osaka",
coords:[[34.6654,135.4323]],
activities:["Universal Studios Japan"],
text:`
Universal Studios Japan

Main areas:
– Super Nintendo World
– Harry Potter

Tips:
Express Pass recommended.

Check Nintendo entry times.
`
},

10:{
date:"Jul 3",
city:"Osaka",
coords:[[34.6937,135.5023],[34.6687,135.5030]],
activities:["Osaka Castle", "Dotonbori"],
text:`
Osaka food + city

Morning:
– Osaka Castle (optional)

Afternoon:
– Kuromon Market

Night:
Dotonbori
– Takoyaki
– Okonomiyaki
– Glico sign photo
`
},

11:{
date:"Jul 4",
city:"Tokyo",
coords:[[35.6702,139.7026]],
activities:["Harajuku"],
text:`
Harajuku

Morning:
– Meiji Shrine forest walk

After:
– Takeshita street
– Omotesando
`
},

12:{
date:"Jul 5",
city:"Tokyo",
coords:[[35.6272,139.7768]],
activities:["Odaiba / TeamLab"],
text:`
Odaiba / TeamLab

Must do:
TeamLab Planets (book in advance)

After:
– DiverCity mall
– Gundam statue
`
},

13:{
date:"Jul 6",
city:"Tokyo",
coords:[[35.6895,139.6917]],
activities:["Free Exploration"],
text:`
Free day

Ideas:
– Ginza luxury shopping
– Shimokitazawa vintage area
– Return to favorite places

Last souvenir shopping.
`
},

14:{
date:"Jul 7",
city:"Tokyo",
coords:[[35.5494,139.7798]],
activities:["Haneda Airport"],
text:`
Departure day

Leave hotel ~3 hours before flight.

Airport snacks:
Japanese KitKat flavors.
`
}

};


function showDay(day){

alert("showDay called for day " + day);

if(currentLayer){
map.removeLayer(currentLayer);
}

const data=trip[day];

let hotel;
if (day <= 4) hotel = hotels.tokyo1;
else if (day == 5) hotel = hotels.hakone;
else if (day <= 8) hotel = hotels.kyoto;
else if (day <= 10) hotel = hotels.osaka;
else hotel = hotels.tokyo2;

currentHotel = hotel;

currentLayer=L.layerGroup();

const poly=L.polyline(data.coords,{weight:4}).addTo(currentLayer);

data.coords.forEach((c, index)=>{
const activity = data.activities && data.activities[index] ? data.activities[index] : 'Attraction ' + (index + 1);
L.marker(c).bindPopup('Day ' + day + ' - ' + activity).addTo(currentLayer);
});

// Add hotel marker
const hotelIcon = L.icon({
  iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
  shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});
L.marker(hotel, {icon: hotelIcon}).bindPopup('Hotel').addTo(currentLayer);

currentLayer.addTo(map);

const bounds = currentLayer.getBounds();
const center = bounds.getCenter();
map.setView(center, 14);

document.getElementById("infoBox").innerHTML=
"<b>"+data.date+" — "+data.city+"</b><pre>"+data.text+"</pre>" +
(data.activities ? "<br><b>Activities:</b> " + data.activities.join(", ") : "") +
"<br><b>Locations:</b> " + data.coords.map(c => "[" + c.join(", ") + "]").join(" → ");

document.getElementById("infoBox").scrollIntoView({behavior: "smooth"});

document.querySelectorAll('#controls button').forEach(b=>b.classList.remove('active'));

const btn=document.querySelector('#controls button[data-day="'+day+'"]');

if(btn)btn.classList.add('active');

localStorage.setItem('lastDay',day);
}


function returnToHotel(){
  if(currentHotel){
    map.setView(currentHotel, 15);
  }
}


window.addEventListener('load',()=>{
const last=localStorage.getItem('lastDay');
if(last)showDay(last);
});

</script>

</body>
</html>
