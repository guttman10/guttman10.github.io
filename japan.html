<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

html,body{
margin:0;
padding:0;
font-family:Roboto,Arial;
background:#f0f2f5;
color:#333;
}

header{
background:#34495e;
color:white;
text-align:center;
padding:20px;
font-size:1.5rem;
}

#returnToHotelBtn{
background:#e67e22;
color:white;
border:none;
padding:4px 8px;
margin-left:10px;
cursor:pointer;
border-radius:4px;
}

#map{
height:75vh;
max-width:1000px;
margin:20px auto;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

#controls{
max-width:1000px;
margin:20px auto;
background:#2c3e50;
padding:15px;
border-radius:8px;

flex-wrap:wrap;
justify-content:center;
gap:10px;
color:white;
}

.cityTitle{
flex-basis:100%;
font-weight:bold;
margin-top:10px;
letter-spacing:1px;
}

button{
border:none;
padding:8px 14px;
border-radius:4px;
background:#e67e22;
color:white;
cursor:pointer;
}

button:hover{
background:#d35400;
}

button.active{
background:#c0392b;
}

#infoBox{
max-width:1000px;
margin:20px auto 40px;
background:white;
padding:25px;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
line-height:1.7;
}

#infoBox b{
display:block;
text-align:center;
font-size:1.3em;
margin-bottom:15px;
}

#infoBox pre{
white-space:pre-wrap;
font-family:Roboto;
}
