// ---------- SHOW DAY ----------
function showDay(day){

  if(currentLayer){
    map.removeLayer(currentLayer);
  }

  const data = trip[day];

  currentLayer = L.layerGroup();

  const poly = L.polyline(data.coords,{weight:4}).addTo(currentLayer);

  data.coords.forEach(c=>{
    L.marker(c).addTo(currentLayer);
  });

  currentLayer.addTo(map);

  map.fitBounds(poly.getBounds());

  document.getElementById("infoBox").innerHTML =
    "<b>Day "+day+" - "+data.city+"</b><pre>"+data.text+"</pre>";

  // highlight active button
  document.querySelectorAll('#controls button').forEach(b=>b.classList.remove('active'));
  const btn = document.querySelector('#controls button[onclick="showDay('+day+')"]');
  if(btn) btn.classList.add('active');

  // remember last selected day
  localStorage.setItem('lastDay', day);
}


// download itinerary text as simple CSV
function downloadItinerary(){
  let csv = 'Day,City,Details\n';
  Object.keys(trip).forEach(d=>{
    const entry = trip[d];
    csv += d+','+entry.city+','+entry.text.replace(/,/g,'')+'\n';
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'itinerary.csv';
  a.click();
}

// on load restore last day
window.addEventListener('load', ()=>{
  const last = localStorage.getItem('lastDay');
  if(last) showDay(last);
});
